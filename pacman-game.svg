<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pac-Man gradient -->
    <radialGradient id="pacmanGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFF99"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </radialGradient>
    
    <!-- Ghost gradients -->
    <radialGradient id="redGhost" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FF6666"/>
      <stop offset="100%" style="stop-color:#FF0000"/>
    </radialGradient>
    
    <radialGradient id="pinkGhost" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFB8FF"/>
      <stop offset="100%" style="stop-color:#FF69B4"/>
    </radialGradient>
    
    <radialGradient id="cyanGhost" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#66FFFF"/>
      <stop offset="100%" style="stop-color:#00FFFF"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#000011"/>
  
  <!-- Game border -->
  <rect x="10" y="10" width="380" height="180" fill="none" stroke="#0066FF" stroke-width="2"/>
  
  <!-- Dots scattered around -->
  <circle cx="50" cy="50" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="80" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="60" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="90" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="70" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="50" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="130" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="140" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="120" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Power pellets -->
  <circle cx="30" cy="30" r="5" fill="#FFFF00">
    <animate attributeName="r" values="5;8;5" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="30" r="5" fill="#FFFF00">
    <animate attributeName="r" values="5;8;5" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="160" r="5" fill="#FFFF00">
    <animate attributeName="r" values="5;8;5" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="160" r="5" fill="#FFFF00">
    <animate attributeName="r" values="5;8;5" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Pac-Man -->
  <g>
    <animateTransform attributeName="transform" type="translate" 
                      values="20,100; 380,100; 380,100; 20,100" 
                      dur="8s" repeatCount="indefinite"/>
    
    <!-- Pac-Man body -->
    <path d="M 0,0 A 12,12 0 1,1 0,0 L 8,0 Z" fill="url(#pacmanGradient)">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0; 15; 0; -15; 0" 
                        dur="0.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- Pac-Man eye -->
    <circle cx="-3" cy="-4" r="2" fill="#000"/>
  </g>
  
  <!-- Red Ghost -->
  <g>
    <animateTransform attributeName="transform" type="translate" 
                      values="350,60; 50,60; 50,140; 350,140; 350,60" 
                      dur="12s" repeatCount="indefinite"/>
    
    <!-- Ghost body -->
    <path d="M -10,-10 A 10,10 0 0,1 10,-10 L 10,10 L 6,6 L 2,10 L -2,6 L -6,10 L -10,10 Z" 
          fill="url(#redGhost)"/>
    
    <!-- Ghost eyes -->
    <circle cx="-4" cy="-4" r="2" fill="white"/>
    <circle cx="4" cy="-4" r="2" fill="white"/>
    <circle cx="-4" cy="-4" r="1" fill="black"/>
    <circle cx="4" cy="-4" r="1" fill="black"/>
  </g>
  
  <!-- Pink Ghost -->
  <g>
    <animateTransform attributeName="transform" type="translate" 
                      values="300,140; 100,140; 100,60; 300,60; 300,140" 
                      dur="10s" repeatCount="indefinite"/>
    
    <!-- Ghost body -->
    <path d="M -10,-10 A 10,10 0 0,1 10,-10 L 10,10 L 6,6 L 2,10 L -2,6 L -6,10 L -10,10 Z" 
          fill="url(#pinkGhost)"/>
    
    <!-- Ghost eyes -->
    <circle cx="-4" cy="-4" r="2" fill="white"/>
    <circle cx="4" cy="-4" r="2" fill="white"/>
    <circle cx="-4" cy="-4" r="1" fill="black"/>
    <circle cx="4" cy="-4" r="1" fill="black"/>
  </g>
  
  <!-- Cyan Ghost -->
  <g>
    <animateTransform attributeName="transform" type="translate" 
                      values="80,80; 320,80; 320,120; 80,120; 80,80" 
                      dur="14s" repeatCount="indefinite"/>
    
    <!-- Ghost body -->
    <path d="M -10,-10 A 10,10 0 0,1 10,-10 L 10,10 L 6,6 L 2,10 L -2,6 L -6,10 L -10,10 Z" 
          fill="url(#cyanGhost)"/>
    
    <!-- Ghost eyes -->
    <circle cx="-4" cy="-4" r="2" fill="white"/>
    <circle cx="4" cy="-4" r="2" fill="white"/>
    <circle cx="-4" cy="-4" r="1" fill="black"/>
    <circle cx="4" cy="-4" r="1" fill="black"/>
  </g>
  
  <!-- Score display -->
  <text x="20" y="25" fill="#FFFF00" font-family="monospace" font-size="12" font-weight="bold">
    SCORE: 
    <tspan>
      <animate attributeName="fill" values="#FFFF00;#FF8C00;#FFFF00" dur="2s" repeatCount="indefinite"/>
      2340
    </tspan>
  </text>
  
  <!-- Game title -->
  <text x="200" y="25" fill="#00FFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">
    AUTO PAC-MAN
    <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </text>
  
  <!-- Maze walls (simplified) -->
  <rect x="60" y="40" width="40" height="8" fill="#0066FF"/>
  <rect x="120" y="40" width="8" height="40" fill="#0066FF"/>
  <rect x="160" y="70" width="80" height="8" fill="#0066FF"/>
  <rect x="280" y="40" width="8" height="40" fill="#0066FF"/>
  <rect x="300" y="40" width="40" height="8" fill="#0066FF"/>
  
  <rect x="60" y="120" width="40" height="8" fill="#0066FF"/>
  <rect x="120" y="110" width="8" height="40" fill="#0066FF"/>
  <rect x="160" y="120" width="80" height="8" fill="#0066FF"/>
  <rect x="280" y="110" width="8" height="40" fill="#0066FF"/>
  <rect x="300" y="120" width="40" height="8" fill="#0066FF"/>
</svg>
