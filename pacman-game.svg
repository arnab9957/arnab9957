<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pac-Man gradient -->
    <radialGradient id="pacmanGradient" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFFF99"/>
      <stop offset="100%" style="stop-color:#FFD700"/>
    </radialGradient>
    
    <!-- Ghost gradients -->
    <radialGradient id="redGhost" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FF6666"/>
      <stop offset="100%" style="stop-color:#FF0000"/>
    </radialGradient>
    
    <radialGradient id="pinkGhost" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#FFB8FF"/>
      <stop offset="100%" style="stop-color:#FF69B4"/>
    </radialGradient>
    
    <radialGradient id="cyanGhost" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#66FFFF"/>
      <stop offset="100%" style="stop-color:#00FFFF"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="300" fill="#000011"/>
  
  <!-- Outer border -->
  <rect x="10" y="10" width="480" height="280" fill="none" stroke="#0066FF" stroke-width="3"/>
  
  <!-- Create a simple but clear maze with wide corridors -->
  <!-- Horizontal corridors -->
  <rect x="20" y="40" width="460" height="20" fill="none" stroke="#0066FF" stroke-width="2"/>
  <rect x="20" y="120" width="460" height="20" fill="none" stroke="#0066FF" stroke-width="2"/>
  <rect x="20" y="200" width="460" height="20" fill="none" stroke="#0066FF" stroke-width="2"/>
  <rect x="20" y="260" width="460" height="20" fill="none" stroke="#0066FF" stroke-width="2"/>
  
  <!-- Vertical corridors -->
  <rect x="40" y="20" width="20" height="260" fill="none" stroke="#0066FF" stroke-width="2"/>
  <rect x="150" y="20" width="20" height="260" fill="none" stroke="#0066FF" stroke-width="2"/>
  <rect x="250" y="20" width="20" height="260" fill="none" stroke="#0066FF" stroke-width="2"/>
  <rect x="350" y="20" width="20" height="260" fill="none" stroke="#0066FF" stroke-width="2"/>
  <rect x="440" y="20" width="20" height="260" fill="none" stroke="#0066FF" stroke-width="2"/>
  
  <!-- Maze walls (obstacles) -->
  <rect x="100" y="80" width="60" height="15" fill="#0066FF"/>
  <rect x="200" y="80" width="60" height="15" fill="#0066FF"/>
  <rect x="300" y="80" width="60" height="15" fill="#0066FF"/>
  
  <rect x="100" y="160" width="60" height="15" fill="#0066FF"/>
  <rect x="200" y="160" width="60" height="15" fill="#0066FF"/>
  <rect x="300" y="160" width="60" height="15" fill="#0066FF"/>
  
  <!-- Central ghost house -->
  <rect x="220" y="130" width="60" height="40" fill="none" stroke="#0066FF" stroke-width="2"/>
  
  <!-- Dots placed only in safe corridor areas -->
  <circle cx="50" cy="50" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="50" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="50" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="50" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="50" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="50" cy="130" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="130" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="130" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="130" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="50" cy="210" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="210" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="210" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="360" cy="210" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="210" r="2" fill="#FFFF00">
    <animate attributeName="opacity" values="1;0;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Power pellets in corners -->
  <circle cx="30" cy="30" r="6" fill="#FFFF00">
    <animate attributeName="r" values="6;9;6" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="30" r="6" fill="#FFFF00">
    <animate attributeName="r" values="6;9;6" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="270" r="6" fill="#FFFF00">
    <animate attributeName="r" values="6;9;6" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="470" cy="270" r="6" fill="#FFFF00">
    <animate attributeName="r" values="6;9;6" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Pac-Man - Top corridor path only -->
  <g>
    <animateTransform attributeName="transform" type="translate" 
                      values="30,50; 160,50; 260,50; 360,50; 450,50; 360,50; 260,50; 160,50; 30,50" 
                      dur="16s" repeatCount="indefinite"/>
    
    <path d="M 0,0 A 8,8 0 1,1 0,0 L 5,0 Z" fill="url(#pacmanGradient)">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0; 25; 0; -25; 0" 
                        dur="0.3s" repeatCount="indefinite"/>
    </path>
    
    <circle cx="-2" cy="-2" r="1" fill="#000"/>
  </g>
  
  <!-- Red Ghost - Middle corridor, opposite direction -->
  <g>
    <animateTransform attributeName="transform" type="translate" 
                      values="450,130; 360,130; 160,130; 50,130; 160,130; 360,130; 450,130" 
                      dur="14s" begin="2s" repeatCount="indefinite"/>
    
    <path d="M -7,-7 A 7,7 0 0,1 7,-7 L 7,7 L 4,4 L 0,7 L -4,4 L -7,7 Z" 
          fill="url(#redGhost)"/>
    
    <circle cx="-2" cy="-2" r="1.2" fill="white"/>
    <circle cx="2" cy="-2" r="1.2" fill="white"/>
    <circle cx="-2" cy="-2" r="0.6" fill="black"/>
    <circle cx="2" cy="-2" r="0.6" fill="black"/>
  </g>
  
  <!-- Pink Ghost - Bottom corridor -->
  <g>
    <animateTransform attributeName="transform" type="translate" 
                      values="50,210; 160,210; 260,210; 360,210; 450,210; 360,210; 260,210; 160,210; 50,210" 
                      dur="18s" begin="4s" repeatCount="indefinite"/>
    
    <path d="M -7,-7 A 7,7 0 0,1 7,-7 L 7,7 L 4,4 L 0,7 L -4,4 L -7,7 Z" 
          fill="url(#pinkGhost)"/>
    
    <circle cx="-2" cy="-2" r="1.2" fill="white"/>
    <circle cx="2" cy="-2" r="1.2" fill="white"/>
    <circle cx="-2" cy="-2" r="0.6" fill="black"/>
    <circle cx="2" cy="-2" r="0.6" fill="black"/>
  </g>
  
  <!-- Cyan Ghost - Vertical movement on left side -->
  <g>
    <animateTransform attributeName="transform" type="translate" 
                      values="50,50; 50,130; 50,210; 50,130; 50,50" 
                      dur="12s" begin="6s" repeatCount="indefinite"/>
    
    <path d="M -7,-7 A 7,7 0 0,1 7,-7 L 7,7 L 4,4 L 0,7 L -4,4 L -7,7 Z" 
          fill="url(#cyanGhost)"/>
    
    <circle cx="-2" cy="-2" r="1.2" fill="white"/>
    <circle cx="2" cy="-2" r="1.2" fill="white"/>
    <circle cx="-2" cy="-2" r="0.6" fill="black"/>
    <circle cx="2" cy="-2" r="0.6" fill="black"/>
  </g>
  
  <!-- Score display -->
  <text x="15" y="20" fill="#FFFF00" font-family="monospace" font-size="12" font-weight="bold">
    SCORE: 
    <tspan fill="#FF8C00">5420</tspan>
  </text>
  
  <!-- Game title -->
  <text x="250" y="20" fill="#00FFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">
    🤖 AUTO PAC-MAN 🤖
  </text>
  
  <!-- Lives -->
  <g transform="translate(400, 15)">
    <text x="0" y="0" fill="#FFFF00" font-family="monospace" font-size="10">LIVES:</text>
    <path d="M 15,-3 A 4,4 0 1,1 15,-3 L 17,-3 Z" fill="#FFD700"/>
    <path d="M 25,-3 A 4,4 0 1,1 25,-3 L 27,-3 Z" fill="#FFD700"/>
    <path d="M 35,-3 A 4,4 0 1,1 35,-3 L 37,-3 Z" fill="#FFD700"/>
  </g>
  
  <!-- Instructions -->
  <text x="250" y="295" fill="#888" font-family="monospace" font-size="8" text-anchor="middle">
    🎮 Pac-Man automatically collects dots while avoiding ghosts
  </text>
</svg>
